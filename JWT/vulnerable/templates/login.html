<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMail — Login (VULNERABLE)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    input, button { font-size: 16px; padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    button { background: #0d6efd; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .warn { background: #fff3cd; border: 1px solid #ffe69c; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
    .error { color: #b02a37; font-size: 14px; }
  </style>
</head>
<body>
  <h1>📬 WebMail</h1>
  <p class="warn">Instancia <strong>VULNERABLE</strong> (puerto 5000)</p>

  <input id="usuario" placeholder="usuario" value="pedro">
  <input id="password" type="password" placeholder="password" value="pedro123">
  <button onclick="login()">Entrar</button>
  <p class="error" id="error"></p>

  <script>
    // Si ya hay token, pasamos directo a la bandeja.
    if (localStorage.getItem('token')) location.href = '/bandeja';

    async function login() {
      document.getElementById('error').textContent = '';
      const r = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          password: document.getElementById('password').value
        })
      });
      const data = await r.json();
      if (data.token) {
        localStorage.setItem('token', data.token);
        location.href = '/bandeja';          // -> pantalla separada
      } else {
        document.getElementById('error').textContent = data.error || 'Error';
      }
    }
  </script>
</body>
</html>
